services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: courseplanner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - planner-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d courseplanner"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: courseplanner
      PGUSER: planner
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: disable
      DATA_DIR: /data
      TERMS: ${TERMS:-WI27}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-12h}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - ./public/data:/data:ro
volumes:
  planner-data:
